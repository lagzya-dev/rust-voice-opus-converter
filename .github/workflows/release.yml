name: Release

# Fires only for version tags (v1.2.3), never for a plain push to main — one release per tag, on purpose.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Only the GUI and CLI are published — OpusVoice.PluginCheck / OpusVoice.Tests need the real Rust/Carbon
      # assemblies, which are game files that cannot be redistributed and are not part of this repository.
      - name: Publish GUI (self-contained, single file)
        run: >
          dotnet publish OpusConverter.Gui/OpusConverter.Gui.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/gui

      - name: Publish CLI (self-contained, single file)
        run: >
          dotnet publish OpusConverter/OpusConverter.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/cli

      - name: Package release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Compress-Archive -Path publish/gui/OpusConverterGui.exe `
            -DestinationPath "dist/OpusConverterGui-$version-win-x64.zip"
          Compress-Archive -Path publish/cli/OpusConverter.exe `
            -DestinationPath "dist/OpusConverterCli-$version-win-x64.zip"
          Copy-Item plugin/OpusVoice.cs dist/OpusVoice.cs

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/OpusConverterGui-${{ github.ref_name }}-win-x64.zip
            dist/OpusConverterCli-${{ github.ref_name }}-win-x64.zip
            dist/OpusVoice.cs
